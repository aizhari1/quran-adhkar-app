name: Flutter CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  # Static analysis + tests. Runs in parallel with the APK build so you always
  # get an APK to try, even when a check fails.
  check:
    name: Analyze & Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Fails on errors only; infos/warnings are reported but don't block.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

  build-apk:
    name: Build APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get 2>&1 | tee pubget.log

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quran-adhkar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            pubget.log
            build.log
          if-no-files-found: ignore

  # Publishes the APK to GitHub Releases when you push a tag like v1.0.0.
  # Only runs if both the checks and the build succeeded.
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build-apk]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quran-adhkar-apk

      - name: Rename APK
        run: mv app-release.apk quran-adhkar-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          files: quran-adhkar-${{ github.ref_name }}.apk
          generate_release_notes: true
