name: quran_adhkar_app
description: Complete offline-first Islamic Quran & Adhkar application with Mushaf, Tafsir, Khatma, Adhkar, Tasbeeh, Prayer Times, and native widgets.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  go_router: ^14.6.2

  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  shared_preferences: ^2.3.3
  home_widget: ^0.7.0

  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  adhan: ^2.0.0+1

  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  intl: any

  collection: ^1.18.0
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.2
  drift_dev: ^2.21.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/quran/
    - assets/adhkar/
    - assets/images/
