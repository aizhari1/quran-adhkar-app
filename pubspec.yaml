name: quran_adhkar_app
description: Offline-first Islamic Quran and Adhkar app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  shared_preferences: 2.3.3
  flutter_local_notifications: 17.2.4
  timezone: 0.9.4
  flutter_timezone: 3.0.1
  adhan: 2.0.0+1
  geolocator: 13.0.2
  permission_handler: 11.3.1
  intl: 0.19.0
  path_provider: 2.1.5
  path: 1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran/
    - assets/adhkar/
    - assets/images/

  fonts:
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
